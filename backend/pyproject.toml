[project]
name = "analysisace-backend"
version = "0.1.0"
description = "analysisACE API, analytics, ingestion and jobs"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "pydantic[email]>=2.9",
    "argon2-cffi>=23.1",
    "cryptography>=43",
    "pydantic-settings>=2.6",
    "sqlalchemy>=2.0.36",
    "alembic>=1.14",
    "psycopg[binary]>=3.2",
    "pyyaml>=6.0",
    "apscheduler>=3.10,<4",
    "tzdata>=2024.2",
    # PDF statements (F13). uharfbuzz shapes Bangla text.
    "fpdf2>=2.8",
    "uharfbuzz>=0.39",
    # Browser notifications (D26).
    "pywebpush>=2.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "pytest-cov>=6.0",
    "httpx2>=2.16",
    "hypothesis>=6.115",
    "ruff>=0.8",
    "mypy>=1.13",
    "types-PyYAML>=6.0",
    # Reads the text of generated PDFs in tests.
    "pypdfium2>=4.30",
]
# Bundled PostgreSQL for machines without Docker. See scripts/dev_db.py.
localdb = ["pgserver>=0.1.4"]

[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]

[tool.setuptools.package-data]
# Noto fonts for the PDF statements (SIL Open Font License).
app = ["assets/fonts/*.ttf", "assets/fonts/OFL.txt"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = ["alembic/versions"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "DTZ", "RUF"]

[tool.ruff.lint.per-file-ignores]
# Seed files are data tables; long literal lines read better unwrapped.
"app/seed/*" = ["E501", "RUF001"]
# Email texts in two languages: one sentence per line reads better than wrapped strings.
"app/services/alert_texts.py" = ["E501", "RUF001"]
"app/services/macro_notes.py" = ["E501", "RUF001"]
"app/services/statements.py" = ["E501", "RUF001"]
"app/services/statement_labels.py" = ["E501", "RUF001"]

[tool.ruff.lint.flake8-bugbear]
extend-immutable-calls = ["fastapi.Depends", "fastapi.Query"]

[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = ["apscheduler.*", "pywebpush.*"]
ignore_missing_imports = true
