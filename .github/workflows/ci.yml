# Checks on every push and pull request (docs/DECISIONS.md, D29).
#   backend   lint, types, unit tests, and migrations against PostgreSQL 16
#   frontend  lint, types, unit tests and a production build
#   e2e       the whole stack (Postgres, API, built web app) with demo data, and every
#             Playwright test at desktop and 360 px, including the admin, analyst and PDF tests
#   compose   docker compose up --build, then the API health check and a web page
name: CI

on:
  push:
    branches: [develop, main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  PYTHON_VERSION: "3.12"
  NODE_VERSION: "22"
  DATABASE_URL: postgresql+psycopg://analysisace:ci-password@localhost:5432/analysisace

jobs:
  backend:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: analysisace
          POSTGRES_PASSWORD: ci-password
          POSTGRES_DB: analysisace
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U analysisace" --health-interval 5s --health-timeout 3s
          --health-retries 10
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: backend/pyproject.toml
      - run: python -m pip install -e ".[dev]"
      - name: Lint
        run: python -m ruff check . && python -m ruff format --check .
      - name: Types
        run: python -m mypy app
      - name: Unit tests
        run: python -m pytest
      - name: Migrations apply and match the models
        run: python -m alembic upgrade head && python -m alembic check

  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - name: Lint and types
        run: npm run lint && npm run typecheck
      - name: Unit tests
        run: npm test
      - name: Production build
        run: npm run build

  e2e:
    needs: [backend, frontend]
    runs-on: ubuntu-latest
    timeout-minutes: 40
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: analysisace
          POSTGRES_PASSWORD: ci-password
          POSTGRES_DB: analysisace
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U analysisace" --health-interval 5s --health-timeout 3s
          --health-retries 10
    env:
      # Development mode: the API makes its own encryption key, and this machine's own
      # address is left out of the per-visitor rate limits (D28) so every test can sign up.
      ENVIRONMENT: development
      DEMO_PASSWORD: ci-demo-password-123
      ADMIN_PASSWORD: ci-admin-password-123
      API_INTERNAL_URL: http://localhost:8000
      E2E_BASE_URL: http://localhost:3000
      E2E_ADMIN_EMAIL: ci-admin@example.com
      E2E_ADMIN_PASSWORD: ci-admin-password-123
      E2E_DEMO_EMAIL: demo@example.com
      E2E_DEMO_PASSWORD: ci-demo-password-123
      E2E_ANALYST_EMAIL: analyst@example.com
      E2E_ANALYST_PASSWORD: ci-demo-password-123
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: backend/pyproject.toml
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install the API
        working-directory: backend
        run: python -m pip install -e .
      - name: Database, demo data and an administrator
        working-directory: backend
        run: |
          python -m alembic upgrade head
          python scripts/seed_demo.py
          python scripts/create_admin.py "$E2E_ADMIN_EMAIL" "CI Admin"
      - name: Start the API
        working-directory: backend
        run: |
          nohup python -m uvicorn app.main:app --port 8000 > "$RUNNER_TEMP/api.log" 2>&1 &
          for i in $(seq 1 60); do
            curl -fsS http://localhost:8000/api/v1/health && exit 0
            sleep 1
          done
          cat "$RUNNER_TEMP/api.log"; exit 1

      - name: Install, build and start the web app
        working-directory: frontend
        run: |
          npm ci
          npm run build
          nohup npm run start > "$RUNNER_TEMP/web.log" 2>&1 &
          for i in $(seq 1 60); do
            curl -fsS -o /dev/null http://localhost:3000/en && exit 0
            sleep 1
          done
          cat "$RUNNER_TEMP/web.log"; exit 1
      - name: Install the test browser
        working-directory: frontend
        run: npx playwright install --with-deps chromium
      - name: Browser tests
        working-directory: frontend
        run: npm run test:e2e

      - name: Logs and traces on failure
        if: failure()
        run: |
          echo "::group::API log"; cat "$RUNNER_TEMP/api.log" || true; echo "::endgroup::"
          echo "::group::Web log"; cat "$RUNNER_TEMP/web.log" || true; echo "::endgroup::"
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-results
          path: frontend/test-results
          retention-days: 7

  compose:
    needs: [backend, frontend]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Start the stack
        run: |
          cp .env.example .env
          docker compose up -d --build
      - name: API health and a web page
        run: |
          for i in $(seq 1 90); do
            curl -fsS http://localhost:8000/api/v1/health && break
            sleep 2
          done
          curl -fsS http://localhost:8000/api/v1/health
          curl -fsS -o /dev/null http://localhost:3000/en
      - name: Logs on failure
        if: failure()
        run: docker compose logs --no-color
      - name: Stop
        if: always()
        run: docker compose down -v
