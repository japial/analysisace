# DSE trading calendar (D37). Weekdays use Python numbering: Monday = 0 ... Sunday = 6.
# Change a date and bump `version`.
version: "0.2.0"
timezone: Asia/Dhaka

# Sunday to Thursday.
trading_weekdays: [6, 0, 1, 2, 3]

# Years whose holidays are taken from an official DSE list. Other years are incomplete until
# checked against the price history: `scripts/check_calendar.py` lists every weekday with no
# trades that is not below, and every listed day that has trades. TODO(owner): confirm
# 2020 to 2025 that way once DSE history is loaded (Q5).
confirmed_years: [2026]

# Market holidays that fall on a trading weekday (Friday and Saturday closures are left out:
# those days are closed anyway). Dates that depend on the moon are the ones the DSE
# observed; future ones are its forecast and must be checked against its notice.
