# Ingestion schedules (PRD section 8). Times are Asia/Dhaka.
version: "0.5.0"
timezone: Asia/Dhaka

jobs:
  eod_prices:
    days: trading
    at: "16:30"
    retry_until: "18:00"
    retry_every_minutes: 15
  corporate_actions: { days: daily, at: "19:00" }
  company_master: { days: weekly, weekday: FRI, at: "09:00" }
  financial_statements: { days: weekly, weekday: FRI, at: "10:00" }
  tbill_auctions: { days: daily, at: "20:00" }
  macro_bangladesh_bank: { days: daily, at: "20:30" }
  cpi: { days: monthly, day: 10, at: "10:00" }
  commodities: { days: daily, at: "08:00" }
  sukuk: { days: weekly, weekday: SAT, at: "09:00" }
  # Personal finance (F12, F14, F20).
  recurring_expenses: { days: daily, at: "00:30" }
  recurring_income: { days: daily, at: "00:35" }
  # Security (D28): forget rate-limit attempts older than a day.
  rate_limit_cleanup: { days: daily, at: "03:00" }
  net_worth_snapshots: { days: daily, at: "18:30" }
  personal_alerts: { days: daily, at: "07:00" }
  monthly_report: { days: monthly, day: 1, at: "08:00" }
  # Market analytics (F1 to F8). They read stored data only, so they need no outside service.
  adjusted_prices: { days: daily, at: "19:30" }
  data_quality: { days: trading, at: "18:15" }
  market_analytics: { days: daily, at: "21:00" }
  macro_note_draft: { days: weekly, weekday: FRI, at: "11:00" }

quality:
  max_unexplained_move_pct: 10.0
  stale_after_trading_days: 3
