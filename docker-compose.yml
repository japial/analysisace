# Full stack: database, migrations, API, worker and web app.
#   cp .env.example .env    (then change the password)
#   docker compose up --build
# Web: http://localhost:3000   API docs: http://localhost:8000/api/v1/docs

x-backend: &backend
  build:
    context: .
    dockerfile: backend/Dockerfile
  environment:
    DATABASE_URL: ${DATABASE_URL}
    ENVIRONMENT: ${ENVIRONMENT:-development}
    CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:3000}
    WEB_BASE_URL: ${WEB_BASE_URL:-http://localhost:3000}
    EMAIL_BACKEND: ${EMAIL_BACKEND:-log}
    EMAIL_FROM: ${EMAIL_FROM:-analysisACE <no-reply@analysisace.com>}
    EMAIL_REPLY_TO: ${EMAIL_REPLY_TO:-}
    SMTP_HOST: ${SMTP_HOST:-}
    SMTP_PORT: ${SMTP_PORT:-587}
    SMTP_SECURITY: ${SMTP_SECURITY:-starttls}
    SMTP_USERNAME: ${SMTP_USERNAME:-}
    SMTP_PASSWORD: ${SMTP_PASSWORD:-}
    OPS_ALERT_EMAILS: ${OPS_ALERT_EMAILS:-}

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10

  migrate:
    <<: *backend
    command: ["alembic", "upgrade", "head"]
    depends_on:
      db:
        condition: service_healthy

  api:
    <<: *backend
    ports:
      - "8000:8000"
    depends_on:
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/v1/health')"
      interval: 10s
      timeout: 3s
      retries: 6

  worker:
    <<: *backend
    command: ["python", "-m", "app.jobs.worker"]
    depends_on:
      migrate:
        condition: service_completed_successfully

  web:
    build:
      context: frontend
      dockerfile: apps/web/Dockerfile
    environment:
      API_INTERNAL_URL: ${API_INTERNAL_URL:-http://api:8000}
    ports:
      - "3000:3000"
    depends_on:
      api:
        condition: service_healthy

volumes:
  pgdata:
